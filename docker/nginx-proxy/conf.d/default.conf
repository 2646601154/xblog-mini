# Main Nginx Reverse Proxy Configuration
# SSL证书路径：/etc/letsencrypt/live/xiaruoxin.cn/

upstream blog-api-backend {
    server blog-api:8080;
}

upstream blog-web-backend {
    server blog-web:80;
}

upstream blog-admin-backend {
    server blog-admin:80;
}

# HTTP - 重定向到HTTPS
server {
    listen 80;
    server_name api.xiaruoxin.cn admin.xiaruoxin.cn web.xiaruoxin.cn xiaruoxin.cn www.xiaruoxin.cn;

    # 顶级域名重定向到前台
    location / {
        return 301 https://web.xiaruoxin.cn$request_uri;
    }
}

# API 子域名
server {
    listen 443 ssl;
    server_name api.xiaruoxin.cn;

    ssl_certificate /etc/letsencrypt/live/xiaruoxin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaruoxin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;
    client_max_body_size 50M;

    # /api/v1/* → /v1/* （去掉 /api 前缀）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://blog-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其他请求直接转发
    location / {
        proxy_pass http://blog-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin 子域名
server {
    listen 443 ssl;
    server_name admin.xiaruoxin.cn;

    ssl_certificate /etc/letsencrypt/live/xiaruoxin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaruoxin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;

    # API 请求代理到后端
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://blog-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件
    location / {
        proxy_pass http://blog-admin-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# 顶级域名和其他域名 - 重定向到前台
server {
    listen 443 ssl;
    server_name xiaruoxin.cn www.xiaruoxin.cn;

    ssl_certificate /etc/letsencrypt/live/xiaruoxin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaruoxin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://web.xiaruoxin.cn$request_uri;
}

# Web 子域名
server {
    listen 443 ssl;
    server_name web.xiaruoxin.cn;

    ssl_certificate /etc/letsencrypt/live/xiaruoxin.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaruoxin.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;

    # API 请求代理到后端
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://blog-api-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态文件
    location / {
        proxy_pass http://blog-web-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
