# 展示端: xblog.xiaruoxin.cn
server {
    listen 80;
    server_name xblog.xiaruoxin.cn;

    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 管理端: xadmin.xiaruoxin.cn
server {
    listen 80;
    server_name xadmin.xiaruoxin.cn;

    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 主域名跳转
server {
    listen 80;
    server_name xiaruoxin.cn www.xiaruoxin.cn;
    return 301 http://xblog.xiaruoxin.cn$request_uri;
}
