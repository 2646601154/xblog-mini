version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xblog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: xblog
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    networks:
      - xblog-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./blog-api
    container_name: xblog-api
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/xblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql:
        condition: service_healthy
    restart: always
    networks:
      - xblog-net

  nginx:
    image: nginx:alpine
    container_name: xblog-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./blog-web/dist:/usr/share/nginx/html/web
      - ./blog-admin/dist:/usr/share/nginx/html/admin
    depends_on:
      - api
    restart: always
    networks:
      - xblog-net

volumes:
  mysql-data:

networks:
  xblog-net:
