# ===========================================
# 本地开发配置（此文件不提交 Git）
# 复制此文件后填入你的真实配置
# ===========================================

spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/xblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: your_db_password

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1

# JWT 配置
jwt:
  secret: your_jwt_secret

# OSS 配置（阿里云）
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: your_access_key_id
  access-key-secret: your_access_key_secret
  bucket-name: your_bucket_name
  url-prefix: https://your_bucket_name.oss-cn-beijing.aliyuncs.com
